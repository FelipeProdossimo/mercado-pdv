name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (.NET 9 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mercado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MERCADO_TEST_CONNECTION: Host=localhost;Port=5432;Database=mercado_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Mercado.sln

      - name: Build
        run: dotnet build Mercado.sln --no-restore --configuration Release

      - name: Testes
        run: >
          dotnet test Mercado.sln --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-api
          path: "**/TestResults/**"

  web:
    name: Front-end (Angular 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mercado-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mercado-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm run test:ci

      - name: Build de produção
        run: npx ng build
