<div class="p-4 md:p-6 xl:p-8 max-w-4xl mx-auto">
  <a routerLink="/produtos" class="inline-flex items-center gap-1 text-suave hover:text-slate-100 mb-3">
    <span class="material-icons">arrow_back</span>
    Produtos
  </a>

  <h1 class="titulo-pagina mb-6">
    @if (id) {
      Editar produto
    } @else {
      Novo produto
    }
  </h1>

  <div class="card p-4 md:p-6 grid grid-cols-1 md:grid-cols-[220px_1fr] gap-6">
    <div>
      <span class="rotulo">Foto</span>
      <label
        class="aspect-square rounded-2xl border-2 border-dashed border-borda bg-painel-2 grid place-items-center overflow-hidden cursor-pointer hover:border-marca transition-colors"
      >
        @if (imagemPreview) {
          <img [src]="imagemPreview" alt="Pré-visualização" class="w-full h-full object-cover" />
        } @else if (produto.imagemUrl) {
          <img
            [src]="'https://localhost:7256' + produto.imagemUrl"
            alt="Foto atual"
            class="w-full h-full object-cover bg-white"
          />
        } @else {
          <span class="flex flex-col items-center gap-2 text-suave text-sm">
            <span class="material-icons !text-4xl">add_photo_alternate</span>
            Escolher imagem
          </span>
        }
        <input type="file" accept="image/*" (change)="selecionarImagem($event)" class="sr-only" />
      </label>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 content-start">
      <div class="sm:col-span-2">
        <label for="descricao" class="rotulo">Descrição</label>
        <input id="descricao" [(ngModel)]="produto.descricao" class="campo" />
      </div>

      <div class="sm:col-span-2">
        <label for="codigoBarras" class="rotulo">Código de barras</label>
        <input id="codigoBarras" [(ngModel)]="produto.codigoBarras" class="campo font-mono" />
      </div>

      <div>
        <label for="valor" class="rotulo">Preço (R$)</label>
        <input id="valor" type="number" step="0.01" [(ngModel)]="produto.valor" class="campo" />
      </div>

      <div>
        <label for="estoque" class="rotulo">Estoque</label>
        <input id="estoque" type="number" [(ngModel)]="produto.estoque" class="campo" />
      </div>

      <div class="sm:col-span-2 flex justify-end gap-2 pt-2">
        <a routerLink="/produtos" class="btn-secundario">Cancelar</a>
        <button type="button" (click)="salvar()" class="btn-primario">
          <span class="material-icons">check</span>
          Salvar
        </button>
      </div>
    </div>
  </div>
</div>
