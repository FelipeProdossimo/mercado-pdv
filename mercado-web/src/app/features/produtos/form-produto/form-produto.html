<div class="p-8 text-white">
  <h1 class="text-4xl font-bold mb-8">
    @if (id) {
      Editar Produto
    } @else {
      Novo Produto
    }
  </h1>

  <div class="mb-6">
    <label class="block mb-2"> Imagem </label>

    <input
      type="file"
      accept="image/*"
      (change)="selecionarImagem($event)"
      class="w-full bg-gray-800 rounded p-3"
    />

    @if (imagemPreview) {
      <img [src]="imagemPreview" class="w-40 h-40 object-cover rounded-lg mt-4" />
    } @else if (produto.imagemUrl && !imagemPreview) {
      <img
        [src]="'https://localhost:7256' + produto.imagemUrl"
        class="w-40 h-40 object-cover rounded-lg mt-4"
      />
    }
  </div>

  <div class="bg-gray-900 rounded-2xl p-6 max-w-2xl">
    <div class="mb-4">
      <label class="block mb-2"> Descrição </label>

      <input [(ngModel)]="produto.descricao" class="w-full bg-gray-800 rounded p-3" />
    </div>

    <div class="mb-4">
      <label class="block mb-2"> Código de Barras </label>

      <input [(ngModel)]="produto.codigoBarras" class="w-full bg-gray-800 rounded p-3" />
    </div>

    <div class="mb-4">
      <label class="block mb-2"> Valor </label>

      <input type="number" [(ngModel)]="produto.valor" class="w-full bg-gray-800 rounded p-3" />
    </div>

    <div class="mb-6">
      <label class="block mb-2"> Estoque </label>

      <input type="number" [(ngModel)]="produto.estoque" class="w-full bg-gray-800 rounded p-3" />
    </div>

    <button (click)="salvar()" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg">
      Salvar
    </button>
  </div>
</div>
